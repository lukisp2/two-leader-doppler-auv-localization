[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "two-leader-doppler-auv-localization"
version = "1.1.1"
description = "Reference implementation for active two-leader Doppler localization and acquire-to-track formation control."
readme = "README.md"
requires-python = "==3.11.9"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Łukasz Marchel", email = "l.marchel@amw.gdynia.pl" },
]
dependencies = [
  "numpy==2.3.3",
  "gymnasium==1.2.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
figures = ["matplotlib==3.10.6"]

[project.urls]
Repository = "https://github.com/lukisp2/two-leader-doppler-auv-localization"

[tool.setuptools]
py-modules = []
